<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — ShoeShop'">ShoeShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="container header-inner">
        <a class="logo" th:href="@{/}">👟 ShoeShop</a>
        <form class="search" th:action="@{/}" method="get">
            <input type="text" name="q" placeholder="Поиск обуви...">
            <button type="submit">Найти</button>
        </form>
        <a class="cart-link" th:href="@{/cart}">
            🛒 Корзина <span class="badge" th:text="${@cartService.count()}">0</span>
        </a>
    </div>
</header>
<footer class="site-footer" th:fragment="footer">
    <div class="container">© ShoeShop — демо-магазин на Java / Spring Boot</div>
</footer>
</body>
</html>
