<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Оформление заказа')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container narrow">
    <h1>Оформление заказа</h1>
    <p>К оплате: <strong th:text="${#numbers.formatDecimal(total, 0, 'WHITESPACE', 0, 'POINT')} + ' ₽'">0 ₽</strong></p>

    <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post" class="form">
        <label>Имя
            <input type="text" th:field="*{customerName}">
            <span class="error" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></span>
        </label>
        <label>Email
            <input type="text" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>
        <label>Телефон
            <input type="text" th:field="*{phone}">
            <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </label>
        <label>Адрес доставки
            <textarea th:field="*{address}" rows="3"></textarea>
            <span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
        </label>
        <button type="submit" class="btn">Подтвердить заказ</button>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
