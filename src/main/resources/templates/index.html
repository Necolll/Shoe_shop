<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Каталог')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container">
    <nav class="filters">
        <a th:href="@{/}" th:classappend="${category == ''} ? 'active'">Все</a>
        <a th:href="@{/(category='men')}" th:classappend="${category == 'men'} ? 'active'">Мужская</a>
        <a th:href="@{/(category='women')}" th:classappend="${category == 'women'} ? 'active'">Женская</a>
        <a th:href="@{/(category='kids')}" th:classappend="${category == 'kids'} ? 'active'">Детская</a>
    </nav>

    <p th:if="${!q.isEmpty()}" class="muted">Результаты по запросу: «<span th:text="${q}"></span>»</p>
    <p th:if="${products.isEmpty()}" class="muted">Ничего не найдено.</p>

    <div class="grid">
        <article class="card" th:each="p : ${products}">
            <a th:href="@{/product/{id}(id=${p.id})}" class="card-img">
                <img th:if="${p.imageUrl}" th:src="${p.imageUrl}" th:alt="${p.name}">
                <span th:unless="${p.imageUrl}" class="placeholder">👟</span>
            </a>
            <div class="card-body">
                <div class="brand" th:text="${p.brand}">Brand</div>
                <h3><a th:href="@{/product/{id}(id=${p.id})}" th:text="${p.name}">Name</a></h3>
                <div class="price" th:text="${#numbers.formatDecimal(p.price, 0, 'WHITESPACE', 0, 'POINT')} + ' ₽'">0 ₽</div>
            </div>
        </article>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
